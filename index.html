<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f4f7fb; color: #1d2433; }
        main { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .sub { color: #667; font-size: 14px; margin: 0 0 16px; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #c5cee0; border-radius: 8px; }
        button { padding: 0 18px; font-size: 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
        button:disabled { background: #9db5ee; cursor: wait; }
        .chips { margin: 10px 0 18px; display: flex; gap: 6px; flex-wrap: wrap; }
        .chips span { font-size: 13px; background: #e5ecfb; color: #234; padding: 5px 10px; border-radius: 14px; cursor: pointer; }
        .card { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px #0001; }
        .me { background: #2563eb; color: #fff; }
        .step { font-size: 13px; border-left: 3px solid #f59e0b; background: #fffbeb; }
        .step code { background: #0000000d; padding: 1px 5px; border-radius: 4px; }
        .answer { white-space: pre-wrap; line-height: 1.65; }
        .err { background: #fee2e2; color: #991b1b; }
        .wait { color: #667; }
    </style>
</head>
<body>
<main>
    <h1>🏝️ 제주 여행 추천 에이전트</h1>
    <p class="sub">질문하면 에이전트가 날씨(get_weather)와 관광지(find_spots) 도구를 스스로 골라 호출해서 추천해 줍니다.</p>

    <form id="form">
        <input id="q" placeholder="예) 내일 서귀포에서 갈 만한 곳 추천해줘" maxlength="300" autocomplete="off">
        <button id="send">추천</button>
    </form>
    <div class="chips" id="chips">
        <span>제주시에서 오늘 가볼 만한 곳은?</span>
        <span>동쪽에서 실내로 갈 만한 곳 알려줘</span>
        <span>비 오면 서귀포 어디가 좋아?</span>
    </div>

    <div id="log"></div>
</main>

<script>
    const TOOL_LABEL = { find_spots: "🔎 find_spots (관광지 검색)", get_weather: "🌤️ get_weather (날씨 조회)" }
    const WEATHER_ICON = w => w.includes("비") || w.includes("소나기") ? "🌧️" : w.includes("눈") ? "❄️" : w.includes("맑") ? "☀️" : "⛅"

    const add = (cls, html) => {
        const d = document.createElement("div")
        d.className = "card " + cls
        d.innerHTML = html
        log.appendChild(d)
        return d
    }
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))

    // 도구 결과를 한 줄로 요약
    const summarize = s => {
        const o = s.output
        if (o.error) return "오류: " + esc(o.error)
        if (s.tool === "get_weather") return `${WEATHER_ICON(o.now.weather)} 지금 ${o.now.weather} ${o.now.temperature}°C · 내일 ${o.forecast[1]?.weather ?? "-"} (강수확률 ${o.forecast[1]?.rain_probability ?? "-"}%)`
        return `${o.total}곳 중 ${o.spots.length}곳: ` + o.spots.map(p => esc(p.name)).join(", ")
    }

    form.onsubmit = async e => {
        e.preventDefault()
        const message = q.value.trim()
        if (!message) return
        add("me", esc(message))
        const wait = add("wait", "에이전트가 도구를 고르는 중...")
        send.disabled = true
        try {
            const r = await fetch("/api/chat", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ message }),
            })
            const d = await r.json()
            wait.remove()
            for (const s of d.steps ?? []) {
                add("step", `${TOOL_LABEL[s.tool] ?? esc(s.tool)} <code>${esc(JSON.stringify(s.input))}</code><br>→ ${summarize(s)}`)
            }
            if (d.error) add("err", esc(d.error))
            else add("answer", esc(d.answer))
        } catch (err) {
            wait.remove()
            add("err", "요청 실패: " + esc(err.message))
        }
        send.disabled = false
        q.value = ""
        window.scrollTo(0, document.body.scrollHeight)
    }

    chips.onclick = e => { if (e.target.tagName === "SPAN") { q.value = e.target.textContent; q.focus() } }
</script>
</body>
</html>
